<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在加载</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
        }
        
        .container {
            text-align: center;
            padding: 30px;
            border-radius: 15px;
            background-color: rgb(255 255 255 / 90%);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        .status {
            margin-top: 20px;
            font-weight: bold;
            min-height: 24px;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            margin-top: 20px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background-color: #3498db;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>正在加载中</h1>
        <div class="loader"></div>
        <p>请稍候，我们正在为您选择最快的访问方式...</p>
        <div class="status" id="status"></div>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <script>
        // 要检测的网址列表
         const sitesToCheck = [
            { name: "快速响应", url: "http://154.64.252.252:8127/" },
            { name: "加速网络", url: "https://app.bjumk.com/" },
            { name: "体验升级", url: "http://154.64.252.252/index.html" }
        ];
        // 主站地址
        const mainSite = "https://app.bjumk.com/";
        
        // 最大检测时间（毫秒）
        const MAX_CHECK_TIME = 4000;
        // 每个站点的超时时间
        const SITE_TIMEOUT = 2000;
        
        // 开始时间
        const startTime = Date.now();
        let hasRedirected = false;
        
        // 更新UI
        function updateStatus(message) {
            const statusElement = document.getElementById('status');
            if (statusElement) {
                statusElement.textContent = message;
            }
            
            // 更新进度条
            const elapsed = Date.now() - startTime;
            const progress = Math.min(100, (elapsed / MAX_CHECK_TIME) * 100);
            document.getElementById('progress').style.width = progress + '%';
        }
        
        // 检查单个站点是否可访问
        function checkSite(site) {
            return new Promise((resolve) => {
                updateStatus(`正在检测 ${site.name}...`);
                
                const img = new Image();
                let timer = setTimeout(() => {
                    img.onload = img.onerror = null;
                    resolve(false);
                }, SITE_TIMEOUT);
                
                img.onload = function() {
                    clearTimeout(timer);
                    resolve(true);
                };
                
                img.onerror = function() {
                    clearTimeout(timer);
                    resolve(false);
                };
                
                // 使用随机参数避免缓存
                img.src = site.url + '?ping=' + Date.now();
            });
        }
        
        // 执行跳转
        function redirect(url) {
            if (!hasRedirected) {
                hasRedirected = true;
                updateStatus("正在跳转...");
                setTimeout(() => {
                    window.location.href = url;
                }, 300);
            }
        }
        
        // 主检测函数
        async function startDetection() {
            updateStatus("开始网络检测...");
            
            // 设置总超时
            const globalTimeout = setTimeout(() => {
                if (!hasRedirected) {
                    redirect(mainSite);
                }
            }, MAX_CHECK_TIME);
            
            // 检查所有备用站点
            for (const site of sitesToCheck) {
                try {
                    const isAvailable = await checkSite(site);
                    
                    if (isAvailable && !hasRedirected) {
                        clearTimeout(globalTimeout);
                        redirect(site.url);
                        return;
                    }
                    
                    // 检查是否已经超时
                    if (Date.now() - startTime >= MAX_CHECK_TIME) {
                        break;
                    }
                } catch (error) {
                    console.error("检测出错:", error);
                }
            }
            
            // 如果所有站点都不可用或超时，跳转到主站
            if (!hasRedirected) {
                clearTimeout(globalTimeout);
                redirect(mainSite);
            }
        }
        
        // 页面加载后开始检测
        window.addEventListener('load', startDetection);
    </script>
</body>
</html>
